<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base2" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#0A0E13"/>
      <stop offset="100%" stop-color="#0D1218"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#123832" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#123832" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1C262F"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#base2)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#dots)" opacity="0.6"/>

  <!-- radar sweep rings, centered off-canvas top-right so only elegant arcs cross the frame -->
  <g stroke="#1E2C33" stroke-width="1" fill="none">
    <circle cx="1740" cy="150" r="260"/>
    <circle cx="1740" cy="150" r="420"/>
    <circle cx="1740" cy="150" r="600"/>
    <circle cx="1740" cy="150" r="800"/>
  </g>
  <g stroke="#14B8A6" stroke-width="1" fill="none" opacity="0.35">
    <circle cx="1740" cy="150" r="420"/>
  </g>

  <!-- fine longitude/latitude reference lines, very subtle -->
  <g stroke="#161F26" stroke-width="1">
    <line x1="0" y1="216" x2="1920" y2="216"/>
    <line x1="0" y1="432" x2="1920" y2="432"/>
    <line x1="0" y1="648" x2="1920" y2="648"/>
    <line x1="0" y1="864" x2="1920" y2="864"/>
    <line x1="384" y1="0" x2="384" y2="1080"/>
    <line x1="768" y1="0" x2="768" y2="1080"/>
    <line x1="1152" y1="0" x2="1152" y2="1080"/>
    <line x1="1536" y1="0" x2="1536" y2="1080"/>
  </g>

  <!-- network of operational nodes with thin connecting lines - reads as "live ops tracking", not decoration -->
  <g>
    <!-- connecting lines first, underneath nodes -->
    <g stroke="#1F3A38" stroke-width="1.2" opacity="0.7">
      <path d="M 300 760 L 560 640 L 820 700 L 1080 560 L 1360 610 L 1620 480" fill="none"/>
      <path d="M 560 640 L 640 420" fill="none"/>
      <path d="M 1080 560 L 1180 340" fill="none"/>
    </g>
    <g stroke="#14B8A6" stroke-width="1" opacity="0.4" stroke-dasharray="2 6">
      <path d="M 300 760 L 560 640 L 820 700 L 1080 560 L 1360 610 L 1620 480" fill="none"/>
    </g>

    <!-- nodes -->
    <circle cx="300" cy="760" r="3" fill="#3B4854"/>
    <circle cx="560" cy="640" r="3" fill="#3B4854"/>
    <circle cx="640" cy="420" r="3" fill="#3B4854"/>
    <circle cx="1360" cy="610" r="3" fill="#3B4854"/>
    <circle cx="1180" cy="340" r="3" fill="#3B4854"/>

    <!-- active/critical node - Chennai anchor -->
    <circle cx="820" cy="700" r="4" fill="#EF4444"/>
    <circle cx="820" cy="700" r="11" fill="none" stroke="#EF4444" stroke-width="1" opacity="0.55"/>
    <circle cx="820" cy="700" r="20" fill="none" stroke="#EF4444" stroke-width="1" opacity="0.28"/>

    <!-- monitored node - amber -->
    <circle cx="1080" cy="560" r="4" fill="#F59E0B"/>
    <circle cx="1080" cy="560" r="11" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.5"/>

    <!-- ok node - teal -->
    <circle cx="1620" cy="480" r="4" fill="#14B8A6"/>
    <circle cx="1620" cy="480" r="11" fill="none" stroke="#14B8A6" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- corner instrument ticks, top-left and bottom-right - gives instrument-panel precision -->
  <g stroke="#26333B" stroke-width="1">
    <line x1="70" y1="60" x2="70" y2="110"/>
    <line x1="45" y1="85" x2="95" y2="85"/>
    <line x1="1850" y1="970" x2="1850" y2="1020"/>
    <line x1="1825" y1="995" x2="1875" y2="995"/>
  </g>

  <!-- faint scanning horizon line -->
  <line x1="0" y1="540" x2="1920" y2="540" stroke="#182228" stroke-width="1" opacity="0.5"/>

  <!-- soft bottom vignette only, no full radial that could look like a spotlight blob -->
  <rect x="0" y="820" width="1920" height="260" fill="#0A0E13" opacity="0.55"/>
</svg>
